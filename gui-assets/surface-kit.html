<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tornado GUI — clean surface assets</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="screens.css">
  <link rel="stylesheet" href="screens-polish.css">
  <style>
    html,body{background:transparent;min-height:0}
    #surface-kit{position:relative;width:1536px;height:1408px;background:transparent}
    .surface-slot{position:absolute;padding:12px}
    .surface-slot>.surface-face{position:relative;inset:auto;width:100%;height:100%;min-width:0;min-height:0;margin:0;transform:none}
    .surface-slot>.game-modal{box-shadow:0 5px 10px #03102155}
    .surface-slot>.modal-header{border-radius:15px}
    .surface-slot>.game-tab{background:#162c43;border-color:#3b5872}
    .surface-slot>.game-tab.active{background:linear-gradient(#354c66,#263c54);border-color:#637b95;--menu-color:#ffc579}
    .surface-slot>.hud-stat{box-shadow:0 4px 9px #03132533}
    .surface-slot>.is-hover{filter:brightness(1.09);box-shadow:0 6px 10px #030d1955,inset 0 1px #fff9}
    .surface-slot>.is-pressed{box-shadow:inset 0 2px 6px #10252b22;border-bottom-width:2px}
  </style>
  <script src="surface-kit.js" defer></script>
</head>
<body><main id="surface-kit" aria-label="Blank reusable button, card, header and panel surfaces"></main></body>
</html>
